packages:
  - "packages/*"
allowBuilds:
  "@openuidev/lang-core": true
  esbuild: false
  lefthook: false
overrides:
  react: 19.3.1
peerDependencyRules:
  # These libraries remain runtime-compatible beyond their published peer ranges.
  allowedVersions:
    motion: "^14.3.0"
    preact: ">=10 <12"
minimumReleaseAgeExclude:
  - "@kamod-ch/brand@0.1.0 || 0.1.11 || 0.1.12 || 0.3.0"
  - "@kamod-ch/motion@0.1.0"
