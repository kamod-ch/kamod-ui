min_version: 1.6.0
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec oxfmt --write {staged_files} && pnpm exec biome check --write --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    lint-fast:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    sync-readme:
      glob: "README.md"
      run: node scripts/sync-package-readme.mjs && git add packages/core/README.md
