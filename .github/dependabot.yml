version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      preact:
        patterns:
          - "preact*"
          - "@preact/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"
          - "tw-*"
      ox:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "@oxlint/*"
          - "@oxfmt/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"
          - "@testing-library/*"
          - "@axe-core/*"
          - "jsdom"
      build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tsup"
          - "typescript"
          - "publint"
          - "@arethetypeswrong/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
