name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, Lint and Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Biome (imports, json, md)
        run: pnpm biome:ci

      - name: Package README sync
        run: pnpm docs:readme:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Dependency hygiene
        run: pnpm qa:deps

      - name: Run tests
        run: pnpm test:ci

      - name: Build project
        run: pnpm build

      - name: Validate published package shape
        run: pnpm qa:publint && pnpm qa:attw

  a11y:
    name: Accessibility audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static accessibility lint
        run: pnpm lint:a11y

      - name: Install Chromium for Playwright
        run: pnpm --filter @kamod-ch/ui-docs exec playwright install --with-deps chromium

      - name: Run Chromium accessibility audits
        run: pnpm test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-playwright-report
          path: packages/docs/playwright-report
          retention-days: 7

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
